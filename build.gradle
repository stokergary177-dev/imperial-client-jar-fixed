plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// FLAT LAYOUT: all .java files sit next to this file (no folders needed).
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
        resources {
            srcDirs = []
        }
    }
}

processResources {
    inputs.property 'version', project.version
    from('fabric.mod.json')
    from('imperial_client.mixins.json')
    from('icon.png') { into 'assets/imperial_client' }
    from('en_us.json') { into 'assets/imperial_client/lang' }
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
